# build exe + MSI และลงนามด้วย SignPath (ดู docs/code-signing.md ก่อนแก้ค่าที่เกี่ยวกับ SignPath)
name: build

# build exe + MSI ทุกครั้งที่ push/PR และลงนามด้วย SignPath เมื่อออก tag v*
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: "1.0.1"

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ติดตั้ง dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: ทดสอบแกนหลัก (เวกเตอร์ RFC 6238)
        run: python xpass.py selftest

      - name: สร้างไอคอน
        run: python tools\make_icon.py

      - name: build exe ด้วย PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name xpass `
            --icon "tools\assets\xpass.ico" `
            --add-data "assets\fonts;assets\fonts" xpass_qt.py

      - name: เตรียม WiX Toolset 3
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile wix314-binaries.zip
          Expand-Archive wix314-binaries.zip -DestinationPath tools\wix -Force

      - name: สร้าง MSI
        run: |
          python tools\make_license_rtf.py
          New-Item -ItemType Directory -Force -Path build\wix | Out-Null
          tools\wix\heat.exe dir "dist\xpass" -cg AppFiles -dr INSTALLFOLDER -gg -g1 -srd -sreg -sfrag -var var.SourceDir -out "tools\files.wxs"
          tools\wix\candle.exe -nologo -arch x64 -dSourceDir="dist\xpass" -out "build\wix\" installer\Product.wxs tools\files.wxs
          tools\wix\light.exe -nologo -ext WixUIExtension -cultures:en-us -out "installer\xpass-$env:APP_VERSION.msi" "build\wix\Product.wixobj" "build\wix\files.wixobj"

      - name: ตรวจสอบผลลัพธ์
        run: |
          if (-not (Test-Path "dist\xpass\xpass.exe")) { throw "ไม่พบ dist\xpass\xpass.exe" }
          if (-not (Test-Path "installer\xpass-$env:APP_VERSION.msi")) { throw "ไม่พบไฟล์ MSI" }
          Get-AuthenticodeSignature "dist\xpass\xpass.exe" | Format-List

      - name: อัปโหลด artifact (ยังไม่ลงนาม)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: xpass-unsigned
          if-no-files-found: error
          path: |
            dist/xpass/**
            installer/*.msi

  # ---------------------------------------------------------------------------
  # ลงนามด้วย SignPath Foundation (ฟรีสำหรับโปรเจกต์ OSS)
  # ทำงานเฉพาะเมื่อ push tag v* และตั้งค่า repo variable SIGNPATH_ORGANIZATION_ID แล้ว
  # ค่าที่ต้องตั้ง: ดู docs/code-signing.md
  # ---------------------------------------------------------------------------
  sign:
    name: sign (SignPath)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ส่งคำขอลงนามและรอผล
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: xpass
          signing-policy-slug: release-signing
          artifact-configuration-slug: xpass
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: อัปโหลด artifact ที่ลงนามแล้ว
        uses: actions/upload-artifact@v4
        with:
          name: xpass-signed
          if-no-files-found: error
          path: signed/**

  release:
    name: release
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/v') && needs.sign.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xpass-signed
          path: signed

      - name: แนบไฟล์กับ GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: signed/**
          generate_release_notes: true
