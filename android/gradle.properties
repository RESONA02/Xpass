org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# หมายเหตุ: -Duser.language=en -Duser.country=US จำเป็นสำหรับเครื่องที่ตั้ง locale ภาษาไทย
# ถ้าไม่ใส่ java.util.Calendar จะคืนปีพุทธศักราช (เช่น 2569) ทำให้ AGP แพ็กวันที่ใน ZIP
# ไม่ได้และ build ล้มด้วย com.google.common.base.VerifyException ที่ MsDosDateTimeUtils.packDate

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
